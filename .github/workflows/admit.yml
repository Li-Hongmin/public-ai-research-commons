name: CRL index admission
on:
  # The workflow and checkout come from trusted main, never the contributor head.
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: '17 * * * *'  # Bounded recovery of skipped/failed events; still opt-in.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to revalidate
        required: true
        type: string
      head:
        description: Optional exact head SHA for a pinned manual retry
        required: false
        type: string
permissions: {}
concurrency:
  group: crl-admission
  cancel-in-progress: false
jobs:
  admit:
    if: vars.CRL_AUTO_ADMIT == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Install dependencies from trusted main
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements.txt
      - name: Revalidate independently, then merge the exact checked head
        env:
          GH_TOKEN: ${{ github.token }}
          CRL_AUTO_ADMIT: ${{ vars.CRL_AUTO_ADMIT }}
          PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number }}
          HEAD_SHA: ${{ inputs.head || github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            .venv/bin/python tools/admission.py --scan --apply
          else
            args=(--pr "$PR_NUMBER" --apply)
            if [ -n "$HEAD_SHA" ]; then args+=(--head "$HEAD_SHA"); fi
            .venv/bin/python tools/admission.py "${args[@]}"
          fi
